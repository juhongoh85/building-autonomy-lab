<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="64x64" href="../../assets/favicon.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<title>FDD demo v2 — Fixed threshold vs adaptive expected range</title>
<meta name="description" content="Fault detection demo: the same residual judged by a fixed threshold and by an adaptive expected range that reflects the prediction uncertainty. Fewer false alarms, same detections.">
<style>
  @font-face {
    font-family: "Pretendard Variable";
    font-weight: 45 920;
    font-style: normal;
    font-display: block;
    src: url("../../assets/fonts/PretendardVariable.woff2") format("woff2");
  }
  :root { --ink: #20262d; --muted: #66707a; --rule: #e0e4e8; --accent: #1e5fa8; --paper: #fff; }
  html, body { margin: 0; background: var(--paper); }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; color: var(--ink); }
  .fdd { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--paper); border: 1px solid var(--rule); overflow: hidden; }
  .fdd canvas { display: block; width: 100%; height: 100%; }
  .fdd__ctl { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; background: rgba(255,255,255,0.0); cursor: pointer; border: 0; padding: 0 0 14%; }
  .fdd__ctl span { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; font: 500 15px/1 "Pretendard Variable", sans-serif; letter-spacing: 0.02em; color: var(--accent); border: 1px solid var(--accent); background: rgba(255,255,255,0.92); }
  .fdd__ctl span::before { content: ""; width: 0; height: 0; border-left: 11px solid var(--accent); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .fdd.is-playing .fdd__ctl { display: none; }
  .fdd__bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--rule); }
  .fdd__bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  /* still mode: used for frame capture — canvas fills the viewport exactly */
  /* 좁은 화면(홈 iframe·폰): Play 버튼을 작게, 제목 문구 아래로 */
  @media (max-width: 520px) {
    .fdd__ctl { padding-bottom: 5%; }
    .fdd__ctl span { padding: 8px 14px; font-size: 13px; gap: 8px; }
    .fdd__ctl span::before { border-left-width: 9px; border-top-width: 6px; border-bottom-width: 6px; }
  }
  body.still .fdd { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; }
  body.still .fdd__ctl, body.still .fdd__bar { display: none; }
</style>
</head>
<body>
  <div class="fdd" id="fdd">
    <canvas id="fdd-canvas" aria-label="Fault detection animation: fixed threshold versus adaptive expected range"></canvas>
    <button class="fdd__ctl" id="fdd-play" type="button" aria-label="Play"><span>Play</span></button>
    <div class="fdd__bar" aria-hidden="true"><i id="fdd-bar"></i></div>
  </div>
  <script src="fdd-data.js"></script>
  <script src="fdd-demo.js" data-src="fdd-data.json"></script>
</body>
</html>
